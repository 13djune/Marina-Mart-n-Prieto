<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <!-- Paper Grain & Fiber Noise Filter -->
    <filter id="paper-noise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="5" result="noise" />
      <feColorMatrix type="matrix" values="
        0.33 0 0 0 0.58
        0 0.33 0 0 0.52
        0 0 0.33 0 0.42
        0 0 0 1 0" in="noise" result="coloredNoise" />
      <feComponentTransfer in="coloredNoise" result="lightNoise">
        <feFuncR type="linear" slope="0.85" intercept="0.15" />
        <feFuncG type="linear" slope="0.80" intercept="0.12" />
        <feFuncB type="linear" slope="0.70" intercept="0.08" />
        <feFuncA type="linear" slope="0.65" />
      </feComponentTransfer>
      <feBlend mode="multiply" in="SourceGraphic" in2="lightNoise" />
    </filter>

    <!-- Edge Patina & Tea Stain Gradients -->
    <radialGradient id="tea-stain-1" cx="30%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#fdfaf3" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#f3ebd7" stop-opacity="0.85" />
      <stop offset="75%" stop-color="#e2d2b3" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#c9b28b" stop-opacity="0.95" />
    </radialGradient>

    <radialGradient id="tea-stain-2" cx="80%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#f5ede0" stop-opacity="0" />
      <stop offset="60%" stop-color="#dec9a3" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#bf9f6e" stop-opacity="0.85" />
    </radialGradient>

    <linearGradient id="fiber-wash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d9c298" stop-opacity="0.4" />
      <stop offset="25%" stop-color="#eedfc2" stop-opacity="0.1" />
      <stop offset="70%" stop-color="#e3ceaa" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#cfb68c" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  <!-- Parchment Base -->
  <rect width="600" height="600" fill="url(#tea-stain-1)" />
  <rect width="600" height="600" fill="url(#fiber-wash)" />
  <rect width="600" height="600" fill="url(#tea-stain-2)" />

  <!-- Organic Aged Patina Rings -->
  <ellipse cx="140" cy="180" rx="90" ry="60" fill="#a88d63" opacity="0.12" />
  <ellipse cx="480" cy="420" rx="120" ry="85" fill="#8c6f43" opacity="0.15" />
  <ellipse cx="260" cy="490" rx="70" ry="45" fill="#bfa378" opacity="0.10" />

  <!-- Paper Grain Overlay Layer -->
  <rect width="600" height="600" fill="#d9caa8" filter="url(#paper-noise)" opacity="0.55" />
</svg>
